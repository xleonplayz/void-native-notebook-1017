<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reading notebook</title><link rel="stylesheet" href="/style.css"></head><body><main><small>OPEN TOOLS / NATIVE EDITION</small><h1>Reading notebook</h1><p>Keep a reading list in SQLite. Entries survive refreshes and server restarts.</p><section class="card"><form id="note-form"><label>Book or article<input id="title" required maxlength="100"></label><button>Add to list</button></form><p id="status" role="status"></p><ul id="notes"></ul></section></main><script>async function refresh(){const r=await fetch('/api/notes');const data=await r.json();document.querySelector('#status').textContent=r.ok?data.notes.length+' saved notes':data.error;const list=document.querySelector('#notes');list.replaceChildren();for(const note of data.notes||[]){const li=document.createElement('li');const mark=document.createElement('input');mark.type='checkbox';mark.style.width='auto';mark.checked=Boolean(note.done);mark.onchange=async()=>{await fetch('/api/notes/'+note.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:mark.checked})});refresh()};const title=document.createElement('span');title.textContent=' '+note.title+' ';const remove=document.createElement('button');remove.textContent='Remove';remove.onclick=async()=>{await fetch('/api/notes/'+note.id,{method:'DELETE'});refresh()};li.append(mark,title,remove);list.append(li)}}
document.querySelector('#note-form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.querySelector('#title').value})});if(r.ok){document.querySelector('#title').value='';await refresh()}else document.querySelector('#status').textContent=(await r.json()).error};refresh();
</script></body></html>
